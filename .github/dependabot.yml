version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # torch upgrades are deliberate; bump manually after testing.
      - dependency-name: "torch"
        update-types: ["version-update:semver-major"]
